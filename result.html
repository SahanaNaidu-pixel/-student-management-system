<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Result</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Student Management System</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="registration.html">Student Registration</a>
      <a href="result.html">Student Result</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <h2>Enter Student Result</h2>
      <form id="resultForm">
        <label>Roll Number
          <input type="text" id="rollNo" placeholder="e.g. 23CS001" required>
        </label>
        <label>Student Name
          <input type="text" id="name" placeholder="Student name" required>
        </label>
        <label>Semester
          <select id="semester" required>
            <option value="">Select</option>
            <option>1</option><option>2</option><option>3</option><option>4</option>
            <option>5</option><option>6</option><option>7</option><option>8</option>
          </select>
        </label>
        <label>Mathematics
          <input type="number" id="maths" min="0" max="100" required>
        </label>
        <label>Physics
          <input type="number" id="physics" min="0" max="100" required>
        </label>
        <label>Chemistry
          <input type="number" id="chemistry" min="0" max="100" required>
        </label>
        <label>English
          <input type="number" id="english" min="0" max="100" required>
        </label>
        <label>Programming
          <input type="number" id="programming" min="0" max="100" required>
        </label>
        <button type="submit">Save Result</button>
      </form>
      <p id="resMessage" class="message"></p>
    </section>

    <section class="card">
      <h2>Results</h2>
      <label>Search by Roll Number
        <input type="text" id="search" placeholder="Type roll number">
      </label>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Roll No</th>
              <th>Name</th>
              <th>Sem</th>
              <th>Maths</th>
              <th>Physics</th>
              <th>Chem</th>
              <th>English</th>
              <th>Prog</th>
              <th>Total</th>
              <th>%</th>
              <th>Grade</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="resultTable"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 College Student Management System</p>
  </footer>

  <script src="result.js"></script>
</body>
</html>
