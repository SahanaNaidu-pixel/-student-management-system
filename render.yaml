# Render Blueprint: https://render.com/docs/blueprint-spec
# Creates the web service and a persistent disk for the SQLite database and photos.
services:
  - type: web
    name: student-management-system
    runtime: node
    # A persistent disk requires a paid instance type; "starter" is the smallest
    plan: starter
    region: singapore
    buildCommand: npm install
    # Creates the first admin account on the very first start, then starts the server.
    # On later starts the database already has records, so nothing is changed.
    startCommand: npm run start:production
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: sms-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: /var/data/sms.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: SESSION_TTL_HOURS
        value: "8"
      # Real use: create only the accounts, no demo students
      - key: SEED_MODE
        value: accounts
      - key: SEED_ADMIN_USERNAME
        value: admin
      # Render asks for this value when you create the Blueprint; it is never stored in the repo
      - key: SEED_ADMIN_PASSWORD
        sync: false
